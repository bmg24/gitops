# TEMPLATE ONLY — do not commit a filled-in copy. Same pattern as the DynaKube token
# (clusters/gke-playground/dynatrace/secret.example.yaml): create the real Secret with
# kubectl so the token never touches Git.
#
#   kubectl create namespace otel-collector    # (or let ArgoCD create it first)
#   kubectl -n otel-collector create secret generic dynatrace-otelcol-credentials \
#     --from-literal=DT_ENDPOINT='https://anr47691.sprint.dynatracelabs.com/api/v2/otlp' \
#     --from-literal=DT_API_TOKEN='dt0c01.<DATA_INGEST_TOKEN>'
#
# The DT_API_TOKEN must be a DATA-INGEST token (classic dt0c01) with scopes:
#   openTelemetryTrace.ingest, metrics.ingest, logs.ingest
# This is DISTINCT from the operator's tokens in the `dynatrace` namespace.
apiVersion: v1
kind: Secret
metadata:
  name: dynatrace-otelcol-credentials
  namespace: otel-collector
type: Opaque
stringData:
  DT_ENDPOINT: "https://anr47691.sprint.dynatracelabs.com/api/v2/otlp"
  DT_API_TOKEN: "dt0c01.REPLACE_WITH_DATA_INGEST_TOKEN"
