apiVersion: dynatrace.com/v1beta6
kind: DynaKube
metadata:
  name: eks-playground
  namespace: dynatrace
  labels:
    dynatrace.com/created-by: "dynatrace.kubernetes"
# Link to api reference for further information: https://docs.dynatrace.com/docs/ingest-from/setup-on-k8s/reference/dynakube-parameters
# Baseline (2026-11-06): generated by Dynatrace for platform tokens; resources trimmed
# for 2 x m6i.xlarge (ActiveGate replicas 3 -> 1, kubernetes-monitoring 10Gi -> 2Gi/4Gi).
# Token Secret `eks-playground` is created by hand, never in Git (see ../bootstrap.md).
spec:
  apiUrl: https://lbn6737h.sprint.dynatracelabs.com/api
  tokens: eks-playground
  networkZone: default
  oneAgent:
    hostGroup: eks-playground
    cloudNativeFullStack:
      # Public ECR: the default registry (478983378254.dkr.ecr...) returns 403 to our nodes.
      image: public.ecr.aws/dynatrace/dynatrace-oneagent:1.349.106.20261029-103936
      codeModulesImage: public.ecr.aws/dynatrace/dynatrace-codemodules:1.347.62.20261019-084101
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
  activeGate:
    image: public.ecr.aws/dynatrace/dynatrace-activegate:1.349.67.20261029-110441
    capabilities:
      - routing
      - debugging
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    replicas: 1
  kubernetesMonitoring:
    image: public.ecr.aws/dynatrace/dynatrace-activegate:1.349.67.20261029-110441
    replicas: 1
    registration:
      clusterName: eks-playground
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
  templates:
    otelCollector:
      imageRef:
        repository: public.ecr.aws/dynatrace/dynatrace-otel-collector
        tag: latest
    kspmNodeConfigurationCollector:
      imageRef:
        repository: public.ecr.aws/dynatrace/dynatrace-k8s-node-config-collector
        tag: 1.6.3
  logMonitoring: {}
  telemetryIngest:
    protocols:
      - jaeger
      - otlp
      - statsd
      - zipkin
    serviceName: telemetry-ingest
  kspm:
    mappedHostPaths:
      - /boot
      - /etc
      - /proc/sys/kernel
      - /sys/fs
      - /sys/kernel/security/apparmor
      - /usr/lib/systemd/system
      - /var/lib
