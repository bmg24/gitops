# Default StorageClass for brian-eks-playground.
# Why gp3: the AWS org SCP (statement DenyCreationOfGP2Volumes) blocks gp2 volumes in this
# account, and EKS does not mark any StorageClass as default on this cluster.
# Parameters are immutable: to change them, delete and recreate this class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
