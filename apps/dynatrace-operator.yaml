apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dynatrace-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # first: installs CRDs + webhook
spec:
  project: playground
  source:
    repoURL: public.ecr.aws/dynatrace
    chart: dynatrace-operator
    # Pinned to the latest GA release as of 2026-11-05. Dynatrace's support table lists
    # Kubernetes 1.37 (the EKS cluster's version) with recommended Operator 1.9.0+.
    # Chart kubeVersion: >=1.25. Fresh install, so no step-by-step upgrade was needed.
    # https://github.com/Dynatrace/dynatrace-operator/releases
    targetRevision: 1.11.1
    helm:
      values: |
        # CSI driver is required for cloudNativeFullStack (local OneAgent cache)
        csidriver:
          enabled: true
        installCRD: true
  destination:
    server: https://kubernetes.default.svc
    namespace: dynatrace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # CRDs can exceed the client-side apply size limit
